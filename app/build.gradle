plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yassirfood.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yassirfood.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('yassir-food-release.jks')
            storePassword project.property('KEYSTORE_PASSWORD')
            keyAlias project.property('KEY_ALIAS')
            keyPassword project.property('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
